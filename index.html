<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PAXI Games</title>
  <style>
    :root{
      --bg:#0f1222; --bg2:#171b32; --text:#e8ebfa; --text-muted:#8b93bd;
      --primary:#7c9bff; --success:#4ade80; --warning:#fbbf24; --danger:#f87171;
      --card:#181c36; --border:#2c3260;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:radial-gradient(1200px 600px at 50% -100px,#1c2244,var(--bg));
      color:var(--text);font-family:system-ui,"Microsoft YaHei","Segoe UI",sans-serif;min-height:100vh;
      padding-bottom:env(safe-area-inset-bottom)}
    .header{display:flex;flex-direction:column;gap:6px;padding:12px;
      border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(15,18,34,.9);
      backdrop-filter:blur(8px);z-index:100}
    .header-row{display:flex;align-items:center;gap:6px}
    .header-row:first-child{justify-content:center}
    .header-row:last-child{justify-content:center}
    .logo{font-size:18px;font-weight:800;white-space:nowrap}
    .logo span{color:var(--primary)}
    button{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);
      color:var(--text);font-size:12px;cursor:pointer;min-height:38px}
    button:hover{border-color:var(--primary)}
    #btnLang{font-weight:700;min-width:46px}
    .main{max-width:560px;margin:0 auto;padding:14px 12px 60px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
    .game-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 8px;
      text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;
      gap:4px;text-align:center;transition:transform .15s,border-color .15s}
    .game-card:hover{border-color:var(--primary)}
    .game-card:active{transform:scale(.95)}
    .game-icon{font-size:40px;line-height:1.2}
    .game-name{font-weight:700;font-size:14px;line-height:1.3}
    .game-price{font-size:11px;color:var(--primary);font-weight:600;margin-top:2px}
    .foot{margin-top:24px;text-align:center;font-size:11px;color:var(--text-muted);line-height:1.9}
    .toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:99999;
      background:#141830;color:var(--text);border:1px solid var(--border);border-radius:10px;
      padding:10px 18px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:92vw}
    .toast.success{border-color:var(--success)}
    .toast.error{border-color:var(--danger);color:#ffc9c9}
    .debug-banner{position:fixed;top:0;left:0;right:0;z-index:99990;background:#7a2b2b;color:#fff;
      text-align:center;font-size:12px;padding:4px}
    @media (max-width:480px){
      .game-icon{font-size:32px}
      .game-name{font-size:12px}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="logo">🎮 PAXI <span>Games</span></div>
    </div>
    <div class="header-row">
      <button id="btnLang">EN</button>
      <button id="btnLeaderboard">🏆 排行榜</button>
      <button id="btnFaucet">🎁 空投</button>
      <button id="btnWallet">连接钱包</button>
      <button id="btnNickname" style="display:none;">✏️ 昵称</button>
    </div>
  </div>

  <div class="main">
    <div class="grid" id="gameGrid"></div>
    <div class="foot" id="foot"></div>
  </div>

  <script src="config.js"></script>
  <script src="common/i18n.js"></script>
  <script>
    const GAMES = [
      { id: 'arrow-puzzle', icon: '➡️', deaths: false },
      { id: 'burn-prc20', icon: '🔥', deaths: false, isBurn: true },
    ];

    function showToast(msg, type = '') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const d = document.createElement('div');
      d.className = 'toast ' + type;
      d.textContent = msg;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 4000);
    }

    (function renderLobbyNow() {
      const c = window.PAXI_CONFIG;
      document.getElementById('btnLang').textContent = window.PAXI_LANG === 'zh' ? 'EN' : '中';
      document.getElementById('btnWallet').textContent = t('shell.connect');

      document.getElementById('gameGrid').innerHTML = GAMES.map(g => {
        if (g.isBurn) {
          return `<a class="game-card" href="#" id="burnCardEntry" style="border-color:rgba(239,68,68,.3)">
            <div class="game-icon">${g.icon}</div>
            <div class="game-name">${t('burn.title')}</div>
            <div class="game-price">🔥 ${t('burn.feeLabel')}：2 PAXI</div>
          </a>`;
        }
        return `
        <a class="game-card" href="games/${g.id}/">
          <div class="game-icon">${g.icon}</div>
          <div class="game-name">${t('game.' + g.id)}</div>
          <div class="game-price">${c.chargeEnabled ? '💳 1 PAXI + 50,000 TOKEN' : t('lobby.free')}</div>
        </a>`;
      }).join('');

      var burnEntry = document.getElementById('burnCardEntry');
      if (burnEntry) {
        burnEntry.onclick = function(e) {
          e.preventDefault();
          _openBurnPanel();
        };
      }

      document.getElementById('foot').textContent = t('lobby.foot');
      document.getElementById('btnLang').onclick = () => setLang(window.PAXI_LANG === 'zh' ? 'en' : 'zh');
      document.getElementById('btnLeaderboard').onclick = () => {
        window.location.href = 'leaderboard.html';
      };
      document.getElementById('btnNickname').onclick = () => {
        if (!state.connected) {
          showToast('请先连接钱包', 'error');
          return;
        }
        const current = localStorage.getItem('paxi_nickname') || '';
        const newName = prompt('请输入你的昵称（最多12个字符）：', current);
        if (newName !== null) {
          const trimmed = newName.trim().slice(0, 12);
          if (trimmed) {
            localStorage.setItem('paxi_nickname', trimmed);
            // 更新昵称映射，供排行榜使用
            const addr = state.wallet.address;
            const map = JSON.parse(localStorage.getItem('paxi_nickname_map') || '{}');
            map[addr] = trimmed;
            localStorage.setItem('paxi_nickname_map', JSON.stringify(map));
            showToast('✅ 昵称已更新为：' + trimmed, 'success');
            updateWalletUI();
          } else {
            showToast('❌ 昵称不能为空', 'error');
          }
        }
      };
    })();

    function _openBurnPanel() {
      var old = document.getElementById('burnOverlay');
      if (old) { old.remove(); return; }
      var overlay = document.createElement('div');
      overlay.id = 'burnOverlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto';
      var inner = document.createElement('div');
      inner.style.cssText = 'max-width:480px;width:100%;margin:auto;';
      overlay.appendChild(inner);
      var closeBtn = document.createElement('div');
      closeBtn.textContent = '✕';
      closeBtn.style.cssText = 'position:fixed;top:16px;right:20px;font-size:24px;color:#fff;cursor:pointer;z-index:100000';
      closeBtn.onclick = function() { overlay.remove(); };
      overlay.appendChild(closeBtn);
      overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);

      function tryRender() {
        var pb = window.PRCBurn;
        if (pb) {
          inner.innerHTML = pb.renderHTML();
          pb.bind(inner);
        } else {
          inner.innerHTML = '<div style="text-align:center;color:#888;padding:40px">Loading...</div>';
          setTimeout(tryRender, 100);
        }
      }
      tryRender();
    }
  </script>

  <script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js" defer></script>
  <script src="common/compat.js" defer></script>
  <script src="common/paxi-sdk.js" defer></script>
  <script src="common/game-pay.js" defer></script>
  <script src="common/faucet.js" defer></script>
  <script src="common/prc-burn.js" defer></script>
  <script>
    window.updateWalletUI = function () {
      const btn = document.getElementById('btnWallet');
      const addr = document.getElementById('walletAddr');
      const bal = document.getElementById('walletBalance');
      const nickBtn = document.getElementById('btnNickname');
      if (!btn) return;
      if (state.connected && state.wallet) {
        btn.textContent = t('shell.disconnect');
        const nickname = localStorage.getItem('paxi_nickname');
        if (addr) {
          if (nickname) {
            addr.textContent = '👤 ' + nickname;
          } else {
            addr.textContent = state.wallet.address.slice(0, 10) + '...' + state.wallet.address.slice(-6);
          }
          addr.style.display = 'inline';
        }
        if (bal) {
          if (state.balance !== null && state.balance !== undefined) {
            bal.textContent = Number(state.balance).toFixed(1) + ' ' + PAXI_CFG().displayDenom;
            bal.style.display = 'inline';
          } else {
            bal.style.display = 'none';
          }
        }
        if (nickBtn) nickBtn.style.display = 'inline-block';
      } else {
        btn.textContent = t('shell.connect');
        if (addr) addr.style.display = 'none';
        if (bal) bal.style.display = 'none';
        if (nickBtn) nickBtn.style.display = 'none';
      }
    };

    window.addEventListener('DOMContentLoaded', function () {
      window.updateWalletUI();
      document.getElementById('btnWallet').onclick = async () => {
        if (state.connected) disconnectWallet();
        else { await connectWallet(); refreshBalance(); }
      };
      document.getElementById('btnFaucet') && (document.getElementById('btnFaucet').onclick = () => PaxiFaucet.openClaim());
    });
  </script>
</body>
</html>
